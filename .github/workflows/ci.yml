name: Valases CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests/api -p "test_*.py" -v

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build: [build, build:candidate]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/web_assessment_react/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app/web_assessment_react
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: app/web_assessment_react
        run: pnpm run ${{ matrix.build }}
